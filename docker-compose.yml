version: '3.8'

services:
  
  db:
    image: postgres:15-alpine
    container_name: smmbox_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smmbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: smmbox_redis
    restart: always
    # Порт наружу не открываем: очередь без пароля, а серверу она доступна по внутренней сети Docker.
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: smmbox_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@db:5432/smmbox?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - TELEGRAM_UPDATES=${TELEGRAM_UPDATES:-polling}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - VK_APP_ID=${VK_APP_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=5000
      - KOMOD_TOKEN=${KOMOD_TOKEN}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.zveno.ai/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-openai/gpt-4o-mini}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/logs:/app/logs         # Теперь логи пишутся куда надо
      - ./backend/uploads:/app/uploads

  
  frontend:
    build: ./frontend
    container_name: smmbox_frontend
    restart: always
    # Снаружи сайт открывается только через nginx с HTTPS на этой же машине.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend


volumes:
  pgdata:
  redisdata: