version: '3.8'

services:
  
  db:
    image: postgres:15-alpine
    container_name: smmbox_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smmbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: smmbox_redis
    restart: always
    # Очередь записывается на диск раз в минуту, если что-то изменилось: при сбое теряется меньше постов.
    command: redis-server --save 60 1
    # Порт наружу не открываем: очередь без пароля, а серверу она доступна по внутренней сети Docker.
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: smmbox_backend
    restart: always
    # При обновлении сайта есть время закончить посты, которые уже отправляются.
    stop_grace_period: 240s
    environment:
      # connection_limit: по умолчанию база даёт сайту 5 соединений, а 20 мест отправки и запросы сайта требуют больше.
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@db:5432/smmbox?schema=public&connection_limit=25
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - TELEGRAM_UPDATES=${TELEGRAM_UPDATES:-polling}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - VK_APP_ID=${VK_APP_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=5000
      - KOMOD_TOKEN=${KOMOD_TOKEN}
      # Сколько постов отправляется одновременно. Было 2: посты, ждущие повтора Kom-OD, держали всю очередь.
      # 20 — безопасный предел для 2 ядер: больше постов одновременно готовят фото, и сайт начинает тормозить.
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-20}
      # Проверка на двух тестовых группах: команда «сетка фото» уходит в Kom-OD, только когда нужно. Для всех: all.
      - KOMOD_GRID_CHECK_TARGETS=${KOMOD_GRID_CHECK_TARGETS:-group_243007100,group_237679542}
      # Разгрузка очереди ВК: пост передаётся в Kom-OD и сразу освобождает место, подтверждение ждёт фоновая проверка.
      # Включено для всех 13.11.2026 после проверки на тестовых группах. Выключить: пустое значение или список групп.
      - KOMOD_BACKGROUND_TARGETS=${KOMOD_BACKGROUND_TARGETS:-all}
      # Сколько постов одного человека одновременно ждут подтверждения Kom-OD (0 — без предела).
      - KOMOD_MAX_ACTIVE_PER_USER=${KOMOD_MAX_ACTIVE_PER_USER:-5}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.zveno.ai/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-openai/gpt-4o-mini}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/logs:/app/logs         # Теперь логи пишутся куда надо
      - ./backend/uploads:/app/uploads

  
  frontend:
    build: ./frontend
    container_name: smmbox_frontend
    restart: always
    # Снаружи сайт открывается только через nginx с HTTPS на этой же машине.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend


volumes:
  pgdata:
  redisdata:
