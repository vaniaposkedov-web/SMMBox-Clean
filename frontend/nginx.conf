# SSL терминируется на хостовом nginx, контейнер отдаёт контент по HTTP
server {
    listen 80;
    server_name sadovodps24.ru www.sadovodps24.ru localhost;
    client_max_body_size 50M;

    # Сжатие: основной файл сайта весит около 1 МБ, а сжатым около 300 КБ.
    # Запросы приходят через nginx на хосте, поэтому нужны gzip_proxied и gzip_http_version 1.0.
    gzip on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Обработка основного роутинга React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # Запрещаем кэшировать index.html, чтобы пользователи всегда получали актуальную версию
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri /index.html;
    }

    # Разрешаем кэшировать статические файлы Vite на год (так как у них меняются хеши в названиях)
    location ~* \.(?:css|js|jpg|svg|png|woff2?|eot|ttf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Знак ^~ обязателен: иначе правило для .jpg и .png выше перехватит фото клиентов, и они не откроются.
    location ^~ /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Живые обновления: новый канал на странице, предупреждения о технических работах.
    location ^~ /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}